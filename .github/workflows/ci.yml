name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  CTEST_PARALLEL_LEVEL: "2"
  RC_PARAMS: "seed=42"

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cc: gcc
            cxx: g++
            build_type: Debug
            shared: "ON"
            asm: AUTO
            benchmarks: "ON"
          - compiler: Clang
            cc: clang
            cxx: clang++
            build_type: Release
            shared: "OFF"
            asm: GENERIC
            benchmarks: "OFF"
    name: linux-${{ matrix.compiler }}-${{ matrix.build_type }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build/strict-debug -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON -DLMCAS_BUILD_TESTS=ON -DLMCAS_BUILD_LMMC_TESTS=ON -DLMMC_BUILD_TESTS=ON -DLMCAS_BUILD_BENCHMARKS=${{ matrix.benchmarks }} -DLMMC_BUILD_EXAMPLES=OFF
          -DLMMC_BUILD_SHARED=${{ matrix.shared }}
          -DLMCAS_WARNINGS_AS_ERRORS=ON -DLMCAS_LMMP_ASM=${{ matrix.asm }}
          -DCMAKE_INSTALL_LIBDIR=lib
      - name: Build
        run: cmake --build build/strict-debug --parallel 2
      - name: Test
        run: ctest --test-dir build/strict-debug --parallel 2 --output-on-failure --no-tests=error --timeout 600
      - name: Check relocated static-PIC package
        if: matrix.shared == 'OFF'
        run: |
          set -euo pipefail
          work="$(mktemp -d "$RUNNER_TEMP/package.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          python3 LMMC/cmake/check_package.py --project lmcas --build-dir build/strict-debug --work-dir "$work/check" --config Release --parallel 2
          python3 -c 'import json,sys; report=json.load(open(sys.argv[1])); assert report["passed"]' "$work/check/package_report.json"

  mingw:
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Release
            shared: "ON"
          - build_type: Debug
            shared: "OFF"
    name: mingw-${{ matrix.build_type }}-shared-${{ matrix.shared }}
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git
          pacboy: toolchain:p cmake:p ninja:p python:p
      - name: Configure
        run: >-
          cmake -S . -B build/strict-debug -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON -DLMCAS_BUILD_TESTS=ON -DLMCAS_BUILD_LMMC_TESTS=ON -DLMMC_BUILD_TESTS=ON -DLMCAS_BUILD_BENCHMARKS=OFF -DLMMC_BUILD_EXAMPLES=OFF
          -DLMMC_BUILD_SHARED=${{ matrix.shared }}
          -DLMCAS_WARNINGS_AS_ERRORS=ON -DLMCAS_LMMP_ASM=AUTO
          -DCMAKE_INSTALL_LIBDIR=lib
      - name: Build
        run: cmake --build build/strict-debug --parallel 2
      - name: Test
        run: ctest --test-dir build/strict-debug --parallel 2 --output-on-failure --no-tests=error --timeout 600
      - name: Check relocated MinGW package
        if: matrix.build_type == 'Release' && matrix.shared == 'ON'
        run: |
          set -euo pipefail
          work="$(mktemp -d "$(cygpath -u "$RUNNER_TEMP")/package.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          python3 LMMC/cmake/check_package.py --project lmcas --build-dir build/strict-debug --work-dir "$work/check" --config Release --parallel 2
          python3 -c 'import json,sys; report=json.load(open(sys.argv[1])); assert report["passed"]' "$work/check/package_report.json"

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            asm: AUTO
          - runner: macos-15-intel
            arch: x86_64
            asm: GENERIC
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Confirm native runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Configure
        run: >-
          cmake -S . -B build/strict-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          -DCMAKE_OTOOL="$(xcrun --find otool)"
          -DCMAKE_INSTALL_NAME_TOOL="$(xcrun --find install_name_tool)"
          -DBUILD_TESTING=ON -DLMCAS_BUILD_TESTS=ON -DLMCAS_BUILD_LMMC_TESTS=ON -DLMMC_BUILD_TESTS=ON -DLMCAS_BUILD_BENCHMARKS=OFF -DLMMC_BUILD_EXAMPLES=OFF
          -DLMMC_BUILD_SHARED=ON
          -DLMCAS_WARNINGS_AS_ERRORS=ON -DLMCAS_LMMP_ASM=${{ matrix.asm }}
          -DCMAKE_INSTALL_LIBDIR=lib
      - name: Build
        run: cmake --build build/strict-debug --parallel 2
      - name: Test
        run: ctest --test-dir build/strict-debug --parallel 2 --output-on-failure --no-tests=error --timeout 600
      - name: Check native relocated standalone packages
        run: |
          set -euo pipefail
          work="$(mktemp -d "$RUNNER_TEMP/package.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          common=(-G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_INSTALL_LIBDIR=lib)
          common+=("-DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}" "-DCMAKE_OTOOL=$(xcrun --find otool)" "-DCMAKE_INSTALL_NAME_TOOL=$(xcrun --find install_name_tool)")
          cmake -S . -B "$work/producer" "${common[@]}" -DLMMC_BUILD_SHARED=ON -DLMCAS_BUILD_TESTS=OFF -DLMCAS_BUILD_LMMC_TESTS=OFF -DLMCAS_BUILD_BENCHMARKS=OFF -DLMMC_BUILD_TESTS=OFF -DLMMC_BUILD_EXAMPLES=OFF -DLMCAS_WARNINGS_AS_ERRORS=ON -DLMCAS_LMMP_ASM=${{ matrix.asm }}
          python3 LMMC/cmake/check_package.py --project lmcas --build-dir "$work/producer" --work-dir "$work/check" --config Release --parallel 2
          python3 -c 'import json,subprocess,sys; report=json.load(open(sys.argv[1])); assert report["passed"]; files=[t["file"] for t in report["targets"].values() if t["type"] == "SHARED_LIBRARY"]; assert files; assert all(subprocess.check_output(["lipo", "-archs", f], text=True).strip() == sys.argv[2] for f in files)' "$work/check/package_report.json" "${{ matrix.arch }}"
          rm -rf "$work/producer" "$work/check"
          cmake -S LMMC -B "$work/producer" "${common[@]}" -DLMMC_BUILD_SHARED=ON -DLMMC_BUILD_TESTS=OFF -DLMMC_BUILD_EXAMPLES=OFF -DLMMC_WARNINGS_AS_ERRORS=ON -DLMMC_LMMP_ASM=${{ matrix.asm }}
          python3 LMMC/cmake/check_package.py --project lmmc --build-dir "$work/producer" --work-dir "$work/check" --config Release --parallel 2
          python3 -c 'import json,subprocess,sys; report=json.load(open(sys.argv[1])); assert report["passed"]; files=[t["file"] for t in report["targets"].values() if t["type"] == "SHARED_LIBRARY"]; assert files; assert all(subprocess.check_output(["lipo", "-archs", f], text=True).strip() == sys.argv[2] for f in files)' "$work/check/package_report.json" "${{ matrix.arch }}"
          rm -rf "$work/producer" "$work/check"

  package-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Check standalone Release package from source snapshot
        run: |
          set -euo pipefail
          work="$(mktemp -d "$RUNNER_TEMP/package.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          python3 LMMC/cmake/check_package.py --project lmcas --snapshot-dir "$work/source"
          cd "$work/source"
          cmake -S . -B "$work/producer" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DCMAKE_INSTALL_LIBDIR=lib \
            -DLMMC_BUILD_SHARED=ON -DLMMC_BUILD_TESTS=OFF -DLMMC_BUILD_EXAMPLES=OFF \
            -DLMCAS_WARNINGS_AS_ERRORS=ON -DLMCAS_LMMP_ASM=AUTO \
            -DLMCAS_BUILD_TESTS=OFF -DLMCAS_BUILD_LMMC_TESTS=OFF -DLMCAS_BUILD_BENCHMARKS=OFF
          python3 LMMC/cmake/check_package.py --project lmcas --build-dir "$work/producer" --work-dir "$work/check" --config Release --parallel 2
          python3 -c 'import json,sys; report=json.load(open(sys.argv[1])); assert report["passed"]' "$work/check/package_report.json"

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure
        run: >-
          cmake -S . -B build/strict-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON -DLMCAS_BUILD_TESTS=ON -DLMCAS_BUILD_LMMC_TESTS=ON -DLMMC_BUILD_TESTS=ON -DLMCAS_BUILD_BENCHMARKS=OFF -DLMMC_BUILD_EXAMPLES=OFF -DLMMC_BUILD_SHARED=ON
          -DLMCAS_WARNINGS_AS_ERRORS=ON -DLMCAS_ENABLE_SANITIZERS=ON -DLMCAS_LMMP_ASM=GENERIC
      - name: Build
        run: cmake --build build/strict-debug --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan.supp
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/strict-debug --parallel 2 --output-on-failure --no-tests=error --timeout 600

  thread-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure
        run: >-
          cmake -S . -B build/strict-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON -DLMCAS_BUILD_TESTS=ON -DLMCAS_BUILD_LMMC_TESTS=ON -DLMMC_BUILD_TESTS=ON -DLMCAS_BUILD_BENCHMARKS=OFF -DLMMC_BUILD_EXAMPLES=OFF -DLMMC_BUILD_SHARED=ON
          -DLMCAS_WARNINGS_AS_ERRORS=ON -DLMCAS_ENABLE_TSAN=ON -DLMCAS_LMMP_ASM=GENERIC
      - name: Build
        run: cmake --build build/strict-debug --parallel 2
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build/strict-debug --parallel 2 --output-on-failure --no-tests=error --timeout 600

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-19
      - name: Configure
        run: >-
          cmake -S . -B build/strict-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=OFF -DLMMC_BUILD_TESTS=OFF -DLMMC_BUILD_EXAMPLES=OFF -DLMMC_BUILD_SHARED=ON
          -DLMCAS_WARNINGS_AS_ERRORS=ON -DLMCAS_ENABLE_CLANG_TIDY=ON
          -DLMCAS_CLANG_TIDY_EXECUTABLE=/usr/bin/clang-tidy-19
          -DLMMC_ENABLE_CLANG_TIDY=ON -DLMMC_CLANG_TIDY_EXECUTABLE=/usr/bin/clang-tidy-19
          -DLMCAS_LMMP_ASM=GENERIC
          -DLMCAS_BUILD_TESTS=OFF -DLMCAS_BUILD_LMMC_TESTS=OFF -DLMCAS_BUILD_BENCHMARKS=OFF
      - name: Analyze
        run: cmake --build build/strict-debug --target lmcas --parallel 2

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install coverage tool
        run: python3 -m pip install gcovr==8.6
      - name: Configure
        run: >-
          cmake -S . -B build/strict-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON -DLMCAS_BUILD_TESTS=ON -DLMCAS_BUILD_LMMC_TESTS=ON -DLMMC_BUILD_TESTS=ON -DLMCAS_BUILD_BENCHMARKS=OFF -DLMMC_BUILD_EXAMPLES=OFF -DLMMC_BUILD_SHARED=ON
          -DLMCAS_WARNINGS_AS_ERRORS=ON -DLMCAS_ENABLE_COVERAGE=ON
          -DLMCAS_ENABLE_SANITIZERS=OFF -DLMCAS_ENABLE_TSAN=OFF -DLMCAS_LMMP_ASM=GENERIC
      - name: Build
        run: cmake --build build/strict-debug --parallel 2
      - name: Test
        run: ctest --test-dir build/strict-debug --parallel 2 --output-on-failure --no-tests=error --timeout 600
      - name: Generate coverage report
        if: always()
        run: >-
          python3 -m gcovr --config .gcovr.cfg --object-directory "${{ github.workspace }}/build/strict-debug"
          --json-summary build/strict-debug/coverage-summary.json
          --xml-pretty --xml build/strict-debug/coverage.xml
          --html-details build/strict-debug/coverage.html
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            build/strict-debug/coverage-summary.json
            build/strict-debug/coverage.xml
            build/strict-debug/coverage.html
            build/strict-debug/coverage.*.html
